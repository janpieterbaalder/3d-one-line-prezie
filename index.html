<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D One Line Prezi</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icon.png" type="image/png" sizes="256x256">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root{
  --bg:#130f26; --panel:#1c1736; --panel-2:#241d45; --line:#342b5e; --line-2:#463b78;
  --ink:#f1ecff; --muted:#a59cc9; --dim:#7a70a3;
  --pink:#ff5eb8; --cyan:#68e3d6; --yellow:#fff38c; --lilac:#c9b0f7;
  --danger:#ff4f86; --radius:12px;
  --font:'Outfit','DM Sans',system-ui,sans-serif; --pixel:'Silkscreen','VT323',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px;border:2px solid var(--panel)}::-webkit-scrollbar-track{background:transparent}

/* ── layout ── */
#app{display:grid;grid-template-rows:54px 1fr;grid-template-columns:232px 1fr 318px;height:100vh}
#top{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:0 12px;background:linear-gradient(90deg,#1b1438,#1a1636 60%,#16223a);border-bottom:1px solid var(--line);position:relative;z-index:50}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#stage{position:relative;min-width:0;min-height:0;background:#0d0a1c}
#props{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}

/* ── top bar ── */
.logo{display:flex;align-items:center;gap:10px;margin-right:10px;white-space:nowrap}
.logo svg{width:30px;height:30px}
.logo b{font-family:var(--pixel);font-size:15px;letter-spacing:.06em;background:linear-gradient(90deg,var(--pink),var(--lilac),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.menu{position:relative}
.tbtn{border:0;background:transparent;padding:8px 11px;border-radius:9px;color:var(--ink);display:flex;align-items:center;gap:6px;white-space:nowrap}
.tbtn:hover,.menu.open>.tbtn{background:rgba(255,255,255,.08)}
.tbtn:disabled{opacity:.35;cursor:default;background:transparent}
.drop{position:absolute;top:calc(100% + 6px);left:0;min-width:250px;background:#211a40;border:1px solid var(--line-2);border-radius:12px;padding:6px;box-shadow:0 18px 50px rgba(0,0,0,.45);display:none}
.menu.open .drop{display:block}
.drop button{display:flex;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:8px;text-align:left;gap:10px;align-items:center}
.drop button:hover{background:rgba(255,94,184,.16)}
.drop button .k{margin-left:auto;color:var(--dim);font-size:12px}
.drop button .ic{width:18px;text-align:center;color:var(--cyan)}
.drop hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.drop .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:6px 10px 2px}
.sw{width:18px;height:18px;border-radius:5px;border:1px solid rgba(255,255,255,.25);flex:none}
.spacer{flex:1}
#docname{color:var(--muted);font-size:13px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px}
#docname i{color:var(--pink);font-style:normal}
.present{display:flex;border-radius:999px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 6px 22px rgba(255,94,184,.35)}
.present button{border:0;background:linear-gradient(135deg,#ff5eb8,#c86bff);color:#fff;font-weight:600;padding:9px 16px}
.present button+button{padding:9px 11px;border-left:1px solid rgba(255,255,255,.3)}
.present button:hover{filter:brightness(1.1)}

/* ── side: slide list ── */
.side-head{display:flex;align-items:center;padding:12px 12px 8px;gap:6px}
.side-head h3{margin:0;font-family:var(--pixel);font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:400;flex:1}
.ibtn{border:0;background:var(--panel-2);border-radius:8px;width:28px;height:28px;display:grid;place-items:center;color:var(--ink)}
.ibtn:hover{background:var(--line-2)}
#slides{flex:1;overflow-y:auto;padding:4px 10px 16px}
.sl{position:relative;margin-bottom:10px;border-radius:10px;padding:5px;border:2px solid transparent;cursor:pointer;background:rgba(255,255,255,.02)}
.sl:hover{background:rgba(255,255,255,.05)}
.sl.on{border-color:var(--pink);background:rgba(255,94,184,.08)}
.sl .th{aspect-ratio:16/9;border-radius:7px;overflow:hidden;background:#fff;display:block}
.sl .th svg{width:100%;height:100%;display:block}
.sl .meta{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:12.5px}
.sl .n{font-family:var(--pixel);font-size:10px;color:var(--cyan);min-width:16px}
.sl .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.sl .acts{position:absolute;top:9px;right:9px;display:none;gap:3px}
.sl:hover .acts{display:flex}
.sl .acts button{border:0;width:21px;height:21px;border-radius:6px;background:rgba(20,15,40,.8);color:#fff;font-size:12px;display:grid;place-items:center}
.sl .acts button:hover{background:var(--pink)}
.sl.drag-over{border-top-color:var(--cyan)}
.addslide{width:100%;border:1.5px dashed var(--line-2);background:transparent;border-radius:10px;padding:12px;color:var(--muted)}
.addslide:hover{border-color:var(--pink);color:var(--ink)}

/* ── stage ── */
#view{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
.seg{position:absolute;top:12px;left:12px;display:flex;background:rgba(20,15,40,.78);backdrop-filter:blur(8px);border:1px solid var(--line-2);border-radius:999px;padding:3px;z-index:5}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;color:var(--muted);font-size:13px}
.seg button.on{background:var(--pink);color:#fff}
.vtools{position:absolute;top:12px;right:12px;display:flex;gap:6px;z-index:5}
.vtools button{border:1px solid var(--line-2);background:rgba(20,15,40,.78);backdrop-filter:blur(8px);border-radius:999px;padding:7px 12px;color:var(--ink);font-size:13px}
.vtools button:hover{border-color:var(--pink)}
.vhint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(20,15,40,.72);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12px;color:var(--muted);white-space:nowrap;pointer-events:none;z-index:5;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.empty-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);pointer-events:none;z-index:4}
.empty-hint b{display:block;font-size:20px;color:var(--ink);margin-bottom:6px;font-weight:500}
#overlay{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.box{position:absolute;border:1.5px dashed rgba(104,227,214,.35);pointer-events:auto;cursor:move;border-radius:3px}
.box:hover{border-color:rgba(104,227,214,.75)}
.box.on{border:1.5px solid var(--pink);box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.box .tag{position:absolute;left:-1px;top:-21px;font-size:11px;background:var(--pink);color:#fff;padding:2px 7px;border-radius:6px 6px 6px 0;white-space:nowrap;display:none}
.box.on .tag{display:block}
.box .hd{position:absolute;width:14px;height:14px;right:-8px;bottom:-8px;background:#fff;border:2px solid var(--pink);border-radius:4px;cursor:nwse-resize;display:none}
.box.on .hd{display:block}
.box .rt{position:absolute;width:14px;height:14px;left:50%;top:-30px;margin-left:-7px;background:var(--pink);border-radius:50%;cursor:grab;display:none}
.box.on .rt{display:block}
.frame-guide{position:absolute;border:1px solid rgba(255,255,255,.18);pointer-events:none}

/* ── props ── */
.tabs{display:flex;gap:4px;padding:10px 10px 0;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:9px 6px 10px;color:var(--muted);border-bottom:2px solid transparent;font-size:13px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--pink)}
#panel{flex:1;overflow-y:auto;padding:12px 14px 30px}
.sec{margin:6px 0 16px}
.sec>h4{margin:0 0 9px;font-family:var(--pixel);font-weight:400;font-size:10.5px;letter-spacing:.14em;color:var(--cyan);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sec>h4::after{content:"";flex:1;height:1px;background:var(--line)}
.row{display:flex;align-items:center;gap:8px;margin:7px 0;min-height:30px}
.row>label{width:96px;flex:none;color:var(--muted);font-size:12.5px;line-height:1.2}
.row>.ctl{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.row.col{flex-direction:column;align-items:stretch}.row.col>label{width:auto}
input[type=text],input[type=number],select,textarea{width:100%;background:#120e25;border:1px solid var(--line);border-radius:8px;padding:6px 8px;outline:none;min-width:0}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{border-color:var(--pink)}
textarea{resize:vertical;min-height:60px;line-height:1.35}
input[type=number]{width:64px;flex:none;padding:5px 6px}
input[type=range]{flex:1;accent-color:var(--pink);min-width:0}
input[type=color]{width:34px;height:28px;border:1px solid var(--line);border-radius:7px;padding:2px;background:#120e25;flex:none}
.chip{border:1px solid var(--line-2);background:var(--panel-2);border-radius:999px;padding:5px 10px;font-size:12px;color:var(--ink)}
.chip:hover{border-color:var(--pink)}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.check{display:flex;align-items:center;gap:8px;margin:7px 0;color:var(--ink);font-size:13px;cursor:pointer}
.check input{accent-color:var(--pink);width:16px;height:16px}
.btn{border:1px solid var(--line-2);background:var(--panel-2);border-radius:9px;padding:8px 12px;color:var(--ink);display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--pink)}
.btn.pink{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.full{width:100%;justify-content:center}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.items{display:flex;flex-direction:column;gap:5px}
.it{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;background:#151030;border:1px solid var(--line);cursor:pointer}
.it:hover{border-color:var(--line-2)}
.it.on{border-color:var(--pink);background:rgba(255,94,184,.08)}
.it .ic{width:22px;height:22px;border-radius:6px;background:var(--panel-2);display:grid;place-items:center;font-size:12px;color:var(--cyan);flex:none}
.it .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.it button{border:0;background:transparent;color:var(--dim);width:22px;height:22px;border-radius:6px}
.it button:hover{background:var(--line-2);color:#fff}
.note{color:var(--dim);font-size:12px;line-height:1.45;margin:6px 0}
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.addrow button{border:1px dashed var(--line-2);background:transparent;border-radius:9px;padding:8px 6px;color:var(--muted);font-size:12.5px;text-align:left}
.addrow button:hover{border-color:var(--pink);color:var(--ink)}
.addrow button span{color:var(--cyan);margin-right:5px}
.pal{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.pal button{width:17px;height:17px;border-radius:5px;border:1px solid rgba(255,255,255,.25);padding:0}
.pal button:hover{transform:scale(1.15)}
.grid2 .row>label{width:auto;min-width:14px}
.grid2 .row input[type=number]{flex:1;width:100%}
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.worlds button{border:2px solid transparent;border-radius:10px;padding:0;overflow:hidden;background:#000;text-align:left}
.worlds button.on{border-color:var(--pink)}
.worlds button i{display:block;height:38px}
.worlds button span{display:block;padding:5px 8px;font-size:12px;background:#151030}

/* ── dialogen ── */
.modal{position:fixed;inset:0;background:rgba(8,5,20,.6);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:200;padding:24px}
.modal.open{display:flex}
.dlg{background:#1e1838;border:1px solid var(--line-2);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.5);max-width:920px;width:100%;max-height:calc(100vh - 48px);display:flex;flex-direction:column}
.dlg.sm{max-width:460px}
.dlg header{display:flex;align-items:center;padding:16px 20px 10px;gap:10px}
.dlg header h2{margin:0;font-size:18px;font-weight:600;flex:1}
.dlg .body{padding:6px 20px 16px;overflow-y:auto}
.dlg footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 18px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lib button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0;overflow:hidden;text-align:left}
.lib button:hover{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink)}
.lib img,.lib svg{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#fff}
.lib span{display:block;padding:6px 9px;font-size:12px;color:#2a1458;background:#f5f0ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib.dark button{background:#130f26}.lib.dark svg{background:#130f26}.lib.dark span{background:#1c1736;color:var(--ink)}
.search{margin-left:auto;max-width:220px}
.help{display:grid;grid-template-columns:1fr 1fr;gap:6px 26px;font-size:13px;line-height:1.5}
.help kbd{display:inline-block;min-width:22px;padding:1px 6px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line-2);font-family:inherit;font-size:12px;text-align:center;margin-right:4px}
.help h5{grid-column:1/-1;margin:12px 0 2px;color:var(--cyan);font-family:var(--pixel);font-weight:400;font-size:10.5px;letter-spacing:.14em}

#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:300;align-items:center;pointer-events:none}
.toast{background:#2a2150;border:1px solid var(--line-2);color:var(--ink);padding:10px 16px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.4);font-size:13.5px;animation:tin .25s ease}
.toast.ok{border-color:var(--cyan)}.toast.err{border-color:var(--danger)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#busy{position:fixed;inset:0;display:none;place-items:center;background:rgba(8,5,20,.55);z-index:400;color:#fff;font-size:15px}
#busy.on{display:grid}
@media (max-width:1100px){#app{grid-template-columns:190px 1fr 280px}}

/* video-editor */
.ve{display:flex;flex-direction:column;gap:8px}
.ve-stage{background:#000;border-radius:12px;overflow:hidden;width:100%;aspect-ratio:16/9;max-height:min(50vh,calc(100vh - 570px));min-height:180px;display:grid;place-items:center}
.ve-stage video,.ve-stage iframe,.ve-stage>div{width:100%;height:100%;display:block;border:0;object-fit:contain}
.ve-ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ve-ctrl .btn:disabled{opacity:.4;cursor:default;border-color:var(--line-2)}
.ve-time{font-variant-numeric:tabular-nums;color:var(--muted);min-width:130px}
.ve-tl{position:relative;height:46px;border-radius:9px;background:repeating-linear-gradient(45deg,#2a2347 0 8px,#211b3b 8px 16px);cursor:pointer;user-select:none;touch-action:none;margin:4px 0}
.ve-keep{position:absolute;top:0;bottom:0;background:rgba(255,94,184,.5);border:2px solid #ff5eb8;border-radius:7px;box-sizing:border-box}
.ve-keep i{position:absolute;top:-2px;bottom:-2px;width:12px;cursor:ew-resize;background:#fff;border-radius:4px;opacity:.9}
.ve-keep i.l{left:-7px}.ve-keep i.r{right:-7px}
.ve-mark{position:absolute;top:-5px;bottom:-5px;background:rgba(255,243,140,.28);border:2px dashed #fff38c;border-radius:6px;pointer-events:none;box-sizing:border-box}
.ve-head{position:absolute;top:-7px;bottom:-7px;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 6px #fff;pointer-events:none}
.ve-legend{font-size:12px;color:var(--muted)}
.ve-sw{display:inline-block;width:14px;height:10px;border-radius:3px;vertical-align:middle;margin-left:6px}
.ve-sw.keep{background:#ff5eb8}.ve-sw.cut{background:repeating-linear-gradient(45deg,#4a3f78 0 3px,#2a2347 3px 6px)}.ve-sw.mark{background:#fff38c}
.ve-list{display:flex;flex-direction:column;gap:5px;max-height:160px;overflow:auto}
.ve-row{display:flex;gap:8px;align-items:center;font-size:13px}
.ve-row input{width:84px}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="logo">
      <svg viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5eb8"/><stop offset=".55" stop-color="#c9b0f7"/><stop offset="1" stop-color="#68e3d6"/></linearGradient></defs><rect x="3" y="3" width="58" height="58" rx="14" fill="#1c1736" stroke="url(#lg)" stroke-width="3"/><path d="M12 44 C20 44 18 22 30 20 C42 18 34 38 44 36 C52 34 50 20 54 16" fill="none" stroke="url(#lg)" stroke-width="5" stroke-linecap="round"/><path d="M12 44 L22 50 M54 16 L46 12" stroke="#68e3d6" stroke-width="2.5" stroke-linecap="round" opacity=".6"/><circle cx="54" cy="16" r="4" fill="#fff38c"/></svg>
      <b>3D ONE LINE PREZI</b>
    </div>
    <div class="menu" data-menu="file"><button class="tbtn">Bestand ▾</button><div class="drop">
      <button data-act="new"><span class="ic">✦</span>Nieuwe presentatie</button>
      <button data-act="open"><span class="ic">⇪</span>Openen…<span class="k">Ctrl+O</span></button>
      <button data-act="save"><span class="ic">⤓</span>Opslaan<span class="k">Ctrl+S</span></button>
      <button data-act="saveas"><span class="ic">⤓</span>Opslaan als…<span class="k">Ctrl+Shift+S</span></button>
      <hr>
      <button data-act="import2d"><span class="ic">◫</span>2D One Line Prezi importeren…</button>
      <button data-act="export"><span class="ic">⟐</span>Exporteren als HTML…</button>
      <button data-act="record"><span class="ic">●</span>Opnemen als video…</button>
      <hr>
      <button data-act="demo"><span class="ic">★</span>Showcase-presentatie laden</button>
      <button data-act="previous"><span class="ic">↺</span>Vorige sessie terugzetten</button>
    </div></div>
    <div class="menu" data-menu="add"><button class="tbtn">Toevoegen ▾</button><div class="drop">
      <button data-act="slide"><span class="ic">▭</span>Nieuwe dia</button>
      <hr>
      <button data-act="library"><span class="ic">✎</span>2D-tekening uit bibliotheek…</button>
      <button data-act="svgfile"><span class="ic">⇪</span>SVG-bestand…</button>
      <button data-act="olt"><span class="ic">ℓ</span>Tekst als lijn…</button>
      <button data-act="shape"><span class="ic">◍</span>3D-tekening, figuur of vorm…</button>
      <hr>
      <button data-act="text"><span class="ic">T</span>Tekst</button>
      <button data-act="image"><span class="ic">▣</span>Afbeelding…</button>
      <button data-act="video"><span class="ic">▶</span>Video (bestand)…</button>
      <button data-act="videolink"><span class="ic">☁</span>Video via link (cloud)…</button>
      <button data-act="youtube"><span class="ic">▶</span>YouTube…</button>
    </div></div>
    <div class="menu" data-menu="layout"><button class="tbtn">Indeling ▾</button><div class="drop">
      <div class="lbl">Dia's in de ruimte zetten</div>
      <button data-layout="rij"><span class="ic">⟶</span>Rij (zoals 2D)</button>
      <button data-layout="trap"><span class="ic">⤴</span>Wenteltrap</button>
      <button data-layout="carrousel"><span class="ic">◌</span>Carrousel</button>
      <button data-layout="golf"><span class="ic">〜</span>Golf in de diepte</button>
      <button data-layout="tunnel"><span class="ic">◎</span>Tunnel</button>
      <button data-layout="sterren"><span class="ic">✧</span>Sterrenstelsel</button>
      <hr>
      <div class="lbl">Lijn tussen de dia's</div>
      <button data-links="vloeiend"><span class="ic">∿</span>Overal vloeiend</button>
      <button data-links="afwisselend"><span class="ic">➰</span>Afwisselend (looping, kurkentrekker, golf)</button>
      <button data-links="verrassing"><span class="ic">🎲</span>Verrassing</button>
    </div></div>
    <div class="menu" data-menu="world"><button class="tbtn">Wereld ▾</button><div class="drop" id="worldmenu"></div></div>
    <button class="tbtn" id="undo" title="Ongedaan maken (Ctrl+Z)">↶</button>
    <button class="tbtn" id="redo" title="Opnieuw (Ctrl+Y)">↷</button>
    <button class="tbtn" id="helpbtn" title="Hulp (F1)">?</button>

    <div id="docname"></div>
    <div class="present"><button id="play" title="Presenteren vanaf het begin (F5)">▶ Presenteren</button><button id="playhere" title="Vanaf deze dia (Shift+F5)">▸ hier</button></div>
  </header>

  <aside id="side">
    <div class="side-head"><h3>DIA'S</h3><button class="ibtn" id="addslide2" title="Nieuwe dia">＋</button></div>

  <main id="stage">
    <canvas id="view" tabindex="0"></canvas>
    <div id="overlay"></div>
    <div class="seg"><button data-mode="world" class="on" title="Draai om de hele lijn heen">🌐 Wereld</button><button data-mode="slide" title="Elementen op de dia plaatsen">▭ Dia bewerken</button></div>
    <div class="vtools"><button id="fitall" title="Alles in beeld">⤢ Alles</button><button id="tocur" title="Naar de gekozen dia">◎ Dia</button></div>
    <div class="empty-hint" id="emptyhint" hidden></div>
    <div class="vhint" id="vhint"></div>
  </main>

  <aside id="props">
    <div class="tabs"><button data-tab="slide" class="on">Dia</button><button data-tab="item">Element</button><button data-tab="pres">Presentatie</button></div>
    <div id="panel"></div>
  </aside>
</div>
